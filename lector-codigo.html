
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Picking - Bodega</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para escanear códigos de barras -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-2">

    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-4">
        <!-- Encabezado compacto -->
        <h2 class="text-xl font-bold text-slate-800 text-center">📦 Validador de Picking</h2>
        <p class="text-[11px] text-gray-500 text-center mb-3">Validación con Cámara y Google Sheets</p>

        <!-- Configuración inicial en 2 columnas -->
        <div class="grid grid-cols-2 gap-2 mb-2 bg-slate-50 p-2.5 rounded-md border">
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Rack:</label>
                <select id="selectRack" onchange="actualizarUbicacionPantalla()" class="w-full rounded border-gray-300 p-1.5 text-sm border bg-white">
                    <!-- Se generan del 01 al 15 dinámicamente -->
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Nivel:</label>
                <input type="text" id="inputNivel" value="A" readonly class="w-full bg-gray-200 rounded border-gray-300 p-1.5 text-sm border font-bold text-center">
            </div>
        </div>

        <!-- 📍 UBICACIÓN EXACTA (Columna E) -->
        <div class="bg-blue-50 border-l-4 border-blue-600 p-2 rounded mb-2">
            <p class="text-[10px] font-bold text-blue-900">📍 UBICACIÓN A LEER (Columna E):</p>
            <div id="lblUbicacionExacta" class="text-xs font-mono font-bold text-blue-700 bg-white p-1.5 rounded border border-blue-200 text-center mt-1">
                Sincronice para ver ubicación
            </div>
        </div>

        <button onclick="cargarDatosSheet()" class="w-full bg-blue-600 text-white font-bold py-1.5 px-3 rounded text-sm hover:bg-blue-700 transition mb-2">
            🔄 Sincronizar / Cargar Datos
        </button>

        <!-- Estado de carga -->
        <div id="statusCarga" class="text-center text-xs font-semibold mb-2 text-gray-500">Datos no sincronizados</div>

        <!-- Sección de Escaneo con Cámara (Visible y restaurada) -->
        <div id="seccionEscaneo" class="hidden mb-2">
            <div class="mb-1 flex justify-between items-center">
                <span class="text-xs font-medium text-slate-700">📷 Cuadro de Escaneo:</span>
                <div>
                    <button onclick="detenerEscanner()" id="btnDetener" class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded hidden font-bold">Apagar</button>
                    <button onclick="reiniciarEscanner()" id="btnIniciar" class="text-[10px] bg-green-100 text-green-600 px-2 py-0.5 rounded font-bold">Encender</button>
                </div>
            </div>
            
            <!-- Contenedor visible de la cámara con tamaño adecuado -->
            <div id="reader" class="w-full rounded border-2 border-dashed border-blue-400 overflow-hidden bg-black h-56"></div>
        </div>

        <!-- Resultados de Validación -->
        <div id="resultadoValidacion" class="p-2 rounded hidden text-center font-bold text-xs"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyOF2mI7w71kuvjd2GRz5gvVJ_xCddPJIdMctoJNi6jpewISZQ_f02CJaRCo7Hvmxy7hg/exec";

        let datosSheet = [];
        let html5QrCode = null;
        let escaneando = false;

        const selectRack = document.getElementById('selectRack');
        for (let i = 1; i <= 15; i++) {
            let numStr = i < 10 ? '0' + i : '' + i;
            let opt = document.createElement('option');
            opt.value = numStr;
            opt.textContent = `Rack ${numStr}`;
            selectRack.appendChild(opt);
        }

        function actualizarUbicacionPantalla() {
            const rackSel = document.getElementById('selectRack').value;
            const nivelSel = document.getElementById('inputNivel').value;
            const lblUbicacion = document.getElementById('lblUbicacionExacta');

            if (datosSheet.length === 0) {
                lblUbicacion.textContent = `Sincronice para ver (Rack -${rackSel}- Nivel ${nivelSel})`;
                return;
            }

            let encontrada = datosSheet.find(row => {
                let esPicking = row.tipo && row.tipo.toUpperCase() === "PICKING";
                let esNivelA = row.nivel && row.nivel.toUpperCase() === nivelSel.toUpperCase();
                let perteneceRack = row.ubicacion && row.ubicacion.includes(`-${rackSel}-`);
                return esPicking && esNivelA && perteneceRack;
            });

            if (encontrada) {
                lblUbicacion.textContent = encontrada.ubicacion;
            } else {
                lblUbicacion.textContent = `⚠️ Sin registro PICKING para Rack ${rackSel}`;
            }
        }

        async function cargarDatosSheet() {
            const status = document.getElementById('statusCarga');
            status.textContent = "Conectando...";
            status.className = "text-center text-xs font-semibold mb-2 text-blue-600";

            try {
                let response = await fetch(WEB_APP_URL);
                datosSheet = await response.json();
                
                status.textContent = `✅ Cargado (${datosSheet.length} registros)`;
                status.className = "text-center text-xs font-semibold mb-2 text-green-600";
                
                actualizarUbicacionPantalla();

                document.getElementById('seccionEscaneo').classList.remove('hidden');
                iniciarEscanner();
            } catch (error) {
                console.error(error);
                status.textContent = "❌ Error al cargar datos.";
                status.className = "text-center text-xs font-semibold mb-2 text-red-600";
            }
        }

        function iniciarEscanner() {
            if (escaneando) return;

            html5QrCode = new Html5Qrcode("reader");
            const config = { 
                fps: 15, 
                qrbox: { width: 240, height: 100 },
                aspectRatio: 1.777778
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText) => { procesarLectura(decodedText); },
                (errorMessage) => {}
            ).then(() => {
                escaneando = true;
                document.getElementById('btnDetener').classList.remove('hidden');
                document.getElementById('btnIniciar').classList.add('hidden');
            }).catch(err => {
                console.error("No se pudo iniciar la cámara", err);
            });
        }

        function detenerEscanner() {
            if (html5QrCode && escaneando) {
                html5QrCode.stop().then(() => {
                    escaneando = false;
                    document.getElementById('btnDetener').classList.add('hidden');
                    document.getElementById('btnIniciar').classList.remove('hidden');
                }).catch(err => console.error(err));
            }
        }

        function reiniciarEscanner() {
            if (!escaneando) { iniciarEscanner(); }
        }

        function procesarLectura(codigoLeido) {
            const rackSeleccionado = document.getElementById('selectRack').value;
            const nivelSeleccionado = document.getElementById('inputNivel').value;
            const divResultado = document.getElementById('resultadoValidacion');

            divResultado.classList.remove('hidden');

            let encontrado = datosSheet.find(row => {
                let esPicking = row.tipo.toUpperCase() === "PICKING";
                let esNivelA = row.nivel.toUpperCase() === nivelSeleccionado.toUpperCase();
                let perteneceRack = row.ubicacion.includes(`-${rackSeleccionado}-`); 
                let coincideCodigo = row.codigoEsperado.trim() === codigoLeido.trim();

                return esPicking && esNivelA && perteneceRack && coincideCodigo;
            });

            if (encontrado) {
                divResultado.className = "p-2 rounded text-center font-bold text-xs bg-green-100 text-green-800 border border-green-400";
                divResultado.innerHTML = `✅ ¡CORRECTO!<br><span class="font-normal">Ubicación: ${encontrado.ubicacion}</span>`;
                beep(600, 200);
            } else {
                divResultado.className = "p-2 rounded text-center font-bold text-xs bg-red-100 text-red-800 border border-red-400";
                divResultado.innerHTML = `❌ NO COINCIDE<br><span class="font-normal">Leído: ${codigoLeido}</span>`;
                beep(200, 400);
            }
        }

        function beep(frequency, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.value = frequency;
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                setTimeout(() => { oscillator.stop(); }, duration);
            } catch(e) {}
        }
    </script>
</body>
</html>
