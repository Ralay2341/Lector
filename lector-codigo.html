<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Picking - Bodega</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para escanear códigos de barras -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* Estilo para resaltar la zona de lectura dentro del video */
        #reader__scan_region {
            background: rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-2">

    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-4">
        <!-- Encabezado -->
        <h2 class="text-xl font-bold text-slate-800 text-center">📦 Validador de Picking</h2>
        <p class="text-[11px] text-gray-500 text-center mb-3">Validación con Cámara en Vivo y Google Sheets</p>

        <!-- Configuración inicial en 2 columnas -->
        <div class="grid grid-cols-2 gap-2 mb-2 bg-slate-50 p-2.5 rounded-md border">
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Rack:</label>
                <select id="selectRack" onchange="reiniciarIndiceYActualizar()" class="w-full rounded border-gray-300 p-1.5 text-sm border bg-white">
                    <!-- Se generan del 01 al 15 dinámicamente -->
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Nivel:</label>
                <input type="text" id="inputNivel" value="A" readonly class="w-full bg-gray-200 rounded border-gray-300 p-1.5 text-sm border font-bold text-center">
            </div>
        </div>

        <!-- 📍 UBICACIÓN EXACTA Y BOTÓN SIGUIENTE -->
        <div class="bg-blue-50 border-l-4 border-blue-600 p-2 rounded mb-2 flex justify-between items-center">
            <div class="overflow-hidden mr-2 flex-1">
                <p class="text-[10px] font-bold text-blue-900">📍 UBICACIÓN A LEER (<span id="contadorIndex">0/0</span>):</p>
                <div id="lblUbicacionExacta" class="text-xs font-mono font-bold text-blue-700 bg-white p-1 rounded border border-blue-200 text-center mt-1 truncate">
                    Sincronice para ver
                </div>
            </div>
            <!-- Botón Siguiente -->
            <button onclick="siguienteRegistro()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-2 rounded text-xs transition shadow flex flex-col items-center justify-center">
                <span>Siguiente</span>
                <span class="text-[10px]">➡</span>
            </button>
        </div>

        <button onclick="cargarDatosSheet()" class="w-full bg-slate-700 text-white font-bold py-1.5 px-3 rounded text-sm hover:bg-slate-800 transition mb-2">
            🔄 Sincronizar / Cargar Datos
        </button>

        <!-- Estado de carga -->
        <div id="statusCarga" class="text-center text-xs font-semibold mb-2 text-gray-500">Datos no sincronizados</div>

        <!-- Sección de Cámara en Vivo con Botón Activador -->
        <div id="seccionEscaneo" class="hidden mb-2">
            <div class="mb-1 flex justify-between items-center">
                <span class="text-xs font-medium text-slate-700">📷 Video en Vivo:</span>
                <span id="indicadorEstado" class="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded">Cámara Activa</span>
            </div>
            
            <!-- Visor de la cámara en vivo -->
            <div id="reader" class="w-full rounded border-2 border-dashed border-blue-400 overflow-hidden bg-black h-48 mb-2"></div>

            <!-- 🔘 BOTÓN QUE ACTIVA LA LECTURA INSTANTÁNEA -->
            <button onclick="activarLecturaBoton()" id="btnDisparador" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-2.5 px-3 rounded text-sm transition shadow flex items-center justify-center">
                <span class="mr-1">⚡ LEER CÓDIGO AHORA</span>
            </button>
        </div>

        <!-- Resultados de Validación -->
        <div id="resultadoValidacion" class="p-2 rounded hidden text-center font-bold text-xs mt-2"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyOF2mI7w71kuvjd2GRz5gvVJ_xCddPJIdMctoJNi6jpewISZQ_f02CJaRCo7Hvmxy7hg/exec";

        let datosSheet = [];
        let html5QrCode = null;
        let escaneando = false;
        let permiteLectura = false; // Controla que solo lea cuando presionas el botón
        let indiceActual = 0;

        const selectRack = document.getElementById('selectRack');
        for (let i = 1; i <= 15; i++) {
            let numStr = i < 10 ? '0' + i : '' + i;
            let opt = document.createElement('option');
            opt.value = numStr;
            opt.textContent = `Rack ${numStr}`;
            selectRack.appendChild(opt);
        }

        function reiniciarIndiceYActualizar() {
            indiceActual = 0;
            actualizarUbicacionPantalla();
        }

        function obtenerRegistrosFiltrados() {
            const rackSel = document.getElementById('selectRack').value;
            const nivelSel = document.getElementById('inputNivel').value;

            if (datosSheet.length === 0) return [];

            return datosSheet.filter(row => {
                let esPicking = row.tipo && row.tipo.toUpperCase() === "PICKING";
                let esNivelA = row.nivel && row.nivel.toUpperCase() === nivelSel.toUpperCase();
                let perteneceRack = row.ubicacion && row.ubicacion.includes(`-${rackSel}-`);
                return esPicking && esNivelA && perteneceRack;
            });
        }

        function actualizarUbicacionPantalla() {
            const lblUbicacion = document.getElementById('lblUbicacionExacta');
            const lblContador = document.getElementById('contadorIndex');
            const rackSel = document.getElementById('selectRack').value;

            if (datosSheet.length === 0) {
                lblUbicacion.textContent = `Sincronice para ver (Rack ${rackSel})`;
                lblContador.textContent = "0/0";
                return;
            }

            let filtrados = obtenerRegistrosFiltrados();

            if (filtrados.length > 0) {
                if (indiceActual >= filtrados.length) {
                    indiceActual = 0;
                }
                let actual = filtrados[indiceActual];
                lblUbicacion.textContent = actual.ubicacion;
                lblContador.textContent = `${indiceActual + 1}/${filtrados.length}`;
            } else {
                lblUbicacion.textContent = `⚠️ Sin registros para Rack ${rackSel}`;
                lblContador.textContent = "0/0";
            }
        }

        function siguienteRegistro() {
            let filtrados = obtenerRegistrosFiltrados();
            if (filtrados.length > 0) {
                indiceActual = (indiceActual + 1) % filtrados.length;
                actualizarUbicacionPantalla();
                document.getElementById('resultadoValidacion').classList.add('hidden');
            }
        }

        async function cargarDatosSheet() {
            const status = document.getElementById('statusCarga');
            status.textContent = "Conectando...";
            status.className = "text-center text-xs font-semibold mb-2 text-blue-600";

            try {
                let response = await fetch(WEB_APP_URL);
                datosSheet = await response.json();
                
                status.textContent = `✅ Cargado (${datosSheet.length} registros)`;
                status.className = "text-center text-xs font-semibold mb-2 text-green-600";
                
                indiceActual = 0;
                actualizarUbicacionPantalla();

                document.getElementById('seccionEscaneo').classList.remove('hidden');
                iniciarCamaraEnVivo();
            } catch (error) {
                console.error(error);
                status.textContent = "❌ Error al cargar datos.";
                status.className = "text-center text-xs font-semibold mb-2 text-red-600";
            }
        }

        function iniciarCamaraEnVivo() {
            if (escaneando) return;

            html5QrCode = new Html5Qrcode("reader");

            // Configuración optimizada para lectura de códigos de barra lineales (1D)
            const config = { 
                fps: 25, 
                qrbox: { width: 300, height: 110 },
                aspectRatio: 1.777778,
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.CODE_39,
                    Html5QrcodeSupportedFormats.UPC_A
                ]
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    // Solo procesa si el usuario acaba de presionar el botón
                    if (permiteLectura) {
                        permiteLectura = false; // Desactiva para no repetir lecturas por accidente
                        procesarLectura(decodedText);
                    }
                },
                (errorMessage) => {}
            ).then(() => {
                escaneando = true;
            }).catch(err => {
                console.error("Fallo al iniciar cámara primaria", err);
                // Intento alternativo
                html5QrCode.start({ facingMode: "user" }, config, (decodedText) => {
                    if (permiteLectura) {
                        permiteLectura = false;
                        procesarLectura(decodedText);
                    }
                }, (e) => {}).then(() => { escaneando = true; });
            });
        }

        // Esta función se ejecuta al tocar "⚡ LEER CÓDIGO AHORA"
        function activarLecturaBoton() {
            permiteLectura = true;
            
            const btn = document.getElementById('btnDisparador');
            btn.className = "w-full bg-amber-500 text-white font-bold py-2.5 px-3 rounded text-sm transition shadow flex items-center justify-center animate-pulse";
            btn.innerHTML = "<span>🔍 Leyendo cuadro...</span>";

            // Si en 3.5 segundos no logra leer un código claro en pantalla, se restaura
            setTimeout(() => {
                if (permiteLectura) {
                    permiteLectura = false;
                    btn.className = "w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-2.5 px-3 rounded text-sm transition shadow flex items-center justify-center";
                    btn.innerHTML = "<span>⚡ LEER CÓDIGO AHORA</span>";
                    
                    const divResultado = document.getElementById('resultadoValidacion');
                    divResultado.classList.remove('hidden');
                    divResultado.className = "p-2 rounded text-center font-bold text-xs bg-amber-100 text-amber-800 border border-amber-400";
                    divResultado.innerHTML = "⚠️ No se detectó código. Encuadre bien las barras y presione de nuevo.";
                }
            }, 3500);
        }

        function procesarLectura(codigoLeido) {
            // Restaurar estilo del botón
            const btn = document.getElementById('btnDisparador');
            btn.className = "w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-2.5 px-3 rounded text-sm transition shadow flex items-center justify-center";
            btn.innerHTML = "<span>⚡ LEER CÓDIGO AHORA</span>";

            const divResultado = document.getElementById('resultadoValidacion');
            divResultado.classList.remove('hidden');

            let filtrados = obtenerRegistrosFiltrados();
            if (filtrados.length === 0) return;

            let actualEsperado = filtrados[indiceActual];
            let coincideCodigo = actualEsperado.codigoEsperado.trim() === codigoLeido.trim();

            if (coincideCodigo) {
                divResultado.className = "p-2 rounded text-center font-bold text-xs bg-green-100 text-green-800 border border-green-400";
                divResultado.innerHTML = `✅ ¡CORRECTO!<br><span class="font-normal">Ubicación validada: ${actualEsperado.ubicacion}</span>`;
                beep(600, 200);
                
                setTimeout(() => {
                    siguienteRegistro();
                }, 1500);
            } else {
                divResultado.className = "p-2 rounded text-center font-bold text-xs bg-red-100 text-red-800 border border-red-400";
                divResultado.innerHTML = `❌ NO COINCIDE<br><span class="font-normal">Leído: ${codigoLeido} (Esperado: ${actualEsperado.codigoEsperado})</span>`;
                beep(200, 400);
            }
        }

        function beep(frequency, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.value = frequency;
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                setTimeout(() => { oscillator.stop(); }, duration);
            } catch(e) {}
        }
    </script>
</body>
</html>
