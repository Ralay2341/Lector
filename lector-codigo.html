<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Picking - Bodega</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para escanear códigos de barras con la cámara -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6">
        <h2 class="text-2xl font-bold text-slate-800 mb-2 text-center">📦 Validador de Picking</h2>
        <p class="text-xs text-gray-500 text-center mb-4">Validación con Cámara y Google Sheets</p>

        <!-- Configuración inicial -->
        <div class="space-y-4 mb-6 bg-slate-50 p-4 rounded-lg border">
            <div>
                <label class="block text-sm font-medium text-slate-700">Seleccione Rack:</label>
                <select id="selectRack" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    <!-- Se generan del 01 al 15 dinámicamente -->
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">Nivel:</label>
                <input type="text" id="inputNivel" value="A" readonly class="mt-1 block w-full bg-gray-100 rounded-md border-gray-300 p-2 border font-bold text-center">
            </div>

            <button onclick="cargarDatosSheet()" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">
                🔄 Sincronizar / Cargar Datos
            </button>
        </div>

        <!-- Estado de carga -->
        <div id="statusCarga" class="text-center text-sm font-semibold mb-4 text-gray-500">Datos no sincronizados</div>

        <!-- Sección de Escaneo con Cámara -->
        <div id="seccionEscaneo" class="hidden">
            <div class="mb-2 flex justify-between items-center">
                <span class="text-sm font-medium text-slate-700">Apunte al código de barras:</span>
                <button onclick="detenerEscanner()" id="btnDetener" class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded hidden font-bold">Apagar Cámara</button>
                <button onclick="reiniciarEscanner()" id="btnIniciar" class="text-xs bg-green-100 text-green-600 px-2 py-1 rounded font-bold">Encender Cámara</button>
            </div>
            
            <!-- Contenedor donde se dibuja la cámara -->
            <div id="reader" class="w-full rounded-lg overflow-hidden border mb-4 bg-black"></div>
        </div>

        <!-- Resultados de Validación -->
        <div id="resultadoValidacion" class="mt-4 p-4 rounded-lg hidden text-center font-bold text-lg"></div>
    </div>

    <script>
        // ⚠️ REEMPLAZA ESTA URL CON TU LINK DE GOOGLE APPS SCRIPT
        const WEB_APP_URL = "TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI";

        let datosSheet = [];
        let html5QrCode = null;
        let escaneando = false;

        // Poblar Racks del 01 al 15 con formato de 2 dígitos
        const selectRack = document.getElementById('selectRack');
        for (let i = 1; i <= 15; i++) {
            let numStr = i < 10 ? '0' + i : '' + i;
            let opt = document.createElement('option');
            opt.value = numStr;
            opt.textContent = `Rack ${numStr}`;
            selectRack.appendChild(opt);
        }

        async function cargarDatosSheet() {
            const status = document.getElementById('statusCarga');
            status.textContent = "Conectando con Google Sheets...";
            status.className = "text-center text-sm font-semibold mb-4 text-blue-600";

            try {
                let response = await fetch(WEB_APP_URL);
                datosSheet = await response.json();
                
                status.textContent = `✅ Datos cargados (${datosSheet.length} registros desde fila 5)`;
                status.className = "text-center text-sm font-semibold mb-4 text-green-600";
                
                document.getElementById('seccionEscaneo').classList.remove('hidden');
                iniciarEscanner();
            } catch (error) {
                console.error(error);
                status.textContent = "❌ Error al cargar datos. Verifique la URL de Apps Script.";
                status.className = "text-center text-sm font-semibold mb-4 text-red-600";
            }
        }

        function iniciarEscanner() {
            if (escaneando) return;

            html5QrCode = new Html5Qrcode("reader");
            const config = { 
                fps: 15, 
                qrbox: { width: 280, height: 120 },
                aspectRatio: 1.777778
            };

            html5QrCode.start(
                { facingMode: "environment" }, // Usa la cámara trasera del celular
                config,
                (decodedText) => {
                    procesarLectura(decodedText);
                },
                (errorMessage) => {
                    // Errores de escaneo continuo se omiten intencionalmente para no saturar consola
                }
            ).then(() => {
                escaneando = true;
                document.getElementById('btnDetener').classList.remove('hidden');
                document.getElementById('btnIniciar').classList.add('hidden');
            }).catch(err => {
                console.error("No se pudo iniciar la cámara", err);
                alert("No se pudo acceder a la cámara. Asegúrese de dar permisos de cámara a su navegador (Chrome/Safari).");
            });
        }

        function detenerEscanner() {
            if (html5QrCode && escaneando) {
                html5QrCode.stop().then(() => {
                    escaneando = false;
                    document.getElementById('btnDetener').classList.add('hidden');
                    document.getElementById('btnIniciar').classList.remove('hidden');
                }).catch(err => console.error("Error al detener cámara", err));
            }
        }

        function reiniciarEscanner() {
            if (!escaneando) {
                iniciarEscanner();
            }
        }

        function procesarLectura(codigoLeido) {
            const rackSeleccionado = document.getElementById('selectRack').value;
            const nivelSeleccionado = document.getElementById('inputNivel').value;
            const divResultado = document.getElementById('resultadoValidacion');

            divResultado.classList.remove('hidden');

            // Validar contra Google Sheets:
            // Columna K = PICKING, Columna J = Nivel A, Columna E = Ubicación (ej: contiene el rack), Columna O = Código esperado
            let encontrado = datosSheet.find(row => {
                let esPicking = row.tipo.toUpperCase() === "PICKING";
                let esNivelA = row.nivel.toUpperCase() === nivelSeleccionado.toUpperCase();
                let perteneceRack = row.ubicacion.includes(`-${rackSeleccionado}-`); 
                let coincideCodigo = row.codigoEsperado.trim() === codigoLeido.trim();

                return esPicking && esNivelA && perteneceRack && coincideCodigo;
            });

            if (encontrado) {
                divResultado.className = "mt-4 p-4 rounded-lg text-center font-bold text-lg bg-green-100 text-green-800 border border-green-400";
                divResultado.innerHTML = `✅ ¡CORRECTO!<br><span class="text-sm font-normal">Fila ${encontrado.fila} | Ubicación: ${encontrado.ubicacion}</span>`;
                beep(600, 200); // Sonido de éxito
            } else {
                divResultado.className = "mt-4 p-4 rounded-lg text-center font-bold text-lg bg-red-100 text-red-800 border border-red-400";
                divResultado.innerHTML = `❌ NO COINCIDE O NO ES PICKING<br><span class="text-sm font-normal">Código leído: ${codigoLeido}<br>Rack: ${rackSeleccionado} | Nivel: ${nivelSeleccionado}</span>`;
                beep(200, 400); // Sonido de error
            }
        }

        // Efectos de sonido rápidos para alertas auditivas en terreno
        function beep(frequency, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.value = frequency;
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                setTimeout(() => { oscillator.stop(); }, duration);
            } catch(e) {}
        }
    </script>
</body>
</html>
