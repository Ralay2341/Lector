<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Picking - Bodega</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para escanear códigos de barras -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Librerías para generación de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6">
        <h2 class="text-2xl font-bold text-slate-800 mb-2 text-center">📦 Validador de Picking</h2>
        <p class="text-xs text-gray-500 text-center mb-4">Validación con Cámara y Google Sheets</p>

        <!-- Configuración inicial -->
        <div class="space-y-4 mb-6 bg-slate-50 p-4 rounded-lg border">
            <div>
                <label class="block text-sm font-medium text-slate-700">Seleccione Rack:</label>
                <select id="selectRack" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    <!-- Se generan del 01 al 16 dinámicamente -->
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">Nivel:</label>
                <input type="text" id="inputNivel" value="A" readonly class="mt-1 block w-full bg-gray-100 rounded-md border-gray-300 p-2 border font-bold text-center">
            </div>

            <!-- Posición de picking a leer -->
            <div class="bg-amber-50 border-l-4 border-amber-500 p-3 rounded-md flex justify-between items-center gap-2">
                <div class="overflow-hidden flex-1">
                    <p class="text-[11px] font-bold text-amber-900">🎯 POSICIÓN A LEER (<span id="contadorIndex">0/0</span>):</p>
                    <div id="lblUbicacionExacta" class="text-xs font-mono font-bold text-amber-800 bg-white p-1.5 rounded border border-amber-200 text-center mt-1 truncate">
                        Sincronice para ver
                    </div>
                </div>
                <button onclick="siguienteRegistro()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-3 py-2 rounded-lg text-xs transition shadow whitespace-nowrap">
                    Siguiente ➡
                </button>
            </div>

            <button onclick="cargarDatosSheet()" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">
                🔄 Sincronizar / Cargar Datos
            </button>
        </div>

        <!-- Estado de carga -->
        <div id="statusCarga" class="text-center text-sm font-semibold mb-4 text-gray-500">Datos no sincronizados</div>

        <!-- Sección de Escaneo con Cámara -->
        <div id="seccionEscaneo" class="hidden">
            <div class="mb-2 flex justify-between items-center">
                <span class="text-sm font-medium text-slate-700">Apunte al código de barras:</span>
                <button onclick="detenerEscanner()" id="btnDetener" class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded hidden font-bold">Apagar Cámara</button>
                <button onclick="reiniciarEscanner()" id="btnIniciar" class="text-xs bg-green-100 text-green-600 px-2 py-1 rounded font-bold">Encender Cámara</button>
            </div>
            
            <div id="reader" class="w-full rounded-lg overflow-hidden border mb-4 bg-black"></div>
        </div>

        <!-- Resultados de Validación -->
        <div id="resultadoValidacion" class="mt-4 p-4 rounded-lg hidden text-center font-bold text-lg"></div>

        <!-- Botón para Generar y Descargar Reporte PDF -->
        <button id="btnExportarPDF" onclick="descargarReportePDF()" class="w-full mt-4 bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition hidden shadow-lg flex items-center justify-center gap-2">
            📄 Descargar Reporte de Errores PDF
        </button>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzmLpCNBXQ34XaBpp0cmpGugOy3r3IB16elWGMH_UR7A3QOYc6vOZMAtxbU45mejsreuw/exec";

        let datosSheet = [];
        let html5QrCode = null;
        let escaneando = false;
        let indiceActual = 0;
        let listaErrores = []; 

        // Poblar Racks del 01 al 16
        const selectRack = document.getElementById('selectRack');
        for (let i = 1; i <= 16; i++) {
            let numStr = i < 10 ? '0' + i : '' + i;
            let opt = document.createElement('option');
            opt.value = numStr;
            opt.textContent = `Rack ${numStr}`;
            selectRack.appendChild(opt);
        }

        function reanudarEscaneoSeguro() {
            if (html5QrCode && escaneando) {
                try {
                    if (html5QrCode.getState() === Html5QrcodeScannerState.PAUSED) {
                        html5QrCode.resume();
                    }
                } catch(e) {
                    console.log("Estado cámara:", e);
                }
            }
        }

        function actualizarInfoUbicacion() {
            indiceActual = 0;
            actualizarUbicacionPantalla();
            reanudarEscaneoSeguro();
        }

        document.getElementById('selectRack').addEventListener('change', actualizarInfoUbicacion);

        // 📍 FILTRADO EXACTO Y ROBUSTO POR COLUMNA H (RACK)
        function obtenerRegistrosFiltrados() {
            const rackSel = document.getElementById('selectRack').value; // Ej: "08"
            const nivelSel = document.getElementById('inputNivel').value;  // Ej: "A"

            if (datosSheet.length === 0) return [];

            const numRackSeleccionado = parseInt(rackSel, 10);

            return datosSheet.filter(row => {
                let esPicking = row.tipo && row.tipo.toUpperCase() === "PICKING";
                let esNivelA = row.nivel && row.nivel.toUpperCase() === nivelSel.toUpperCase();
                
                // Limpia y convierte a entero el rack traído de la Columna H
                let numRackFila = parseInt(String(row.rack).replace(/\D/g, ''), 10);

                let perteneceRackExacto = !isNaN(numRackFila) && numRackFila === numRackSeleccionado;

                return esPicking && esNivelA && perteneceRackExacto;
            });
        }

        function actualizarUbicacionPantalla() {
            const lblUbicacion = document.getElementById('lblUbicacionExacta');
            const lblContador = document.getElementById('contadorIndex');
            const rackSel = document.getElementById('selectRack').value;

            if (datosSheet.length === 0) {
                lblUbicacion.textContent = `Sincronice para ver (Rack ${rackSel})`;
                lblContador.textContent = "0/0";
                return;
            }

            let filtrados = obtenerRegistrosFiltrados();

            if (filtrados.length > 0) {
                if (indiceActual >= filtrados.length) {
                    indiceActual = 0;
                }
                let actual = filtrados[indiceActual];
                lblUbicacion.textContent = actual.ubicacion;
                lblContador.textContent = `${indiceActual + 1}/${filtrados.length}`;
            } else {
                lblUbicacion.textContent = `⚠️ Sin registros para Rack ${rackSel}`;
                lblContador.textContent = "0/0";
            }
        }

        function siguienteRegistro() {
            let filtrados = obtenerRegistrosFiltrados();
            if (filtrados.length > 0) {
                indiceActual = (indiceActual + 1) % filtrados.length;
                actualizarUbicacionPantalla();
                document.getElementById('resultadoValidacion').classList.add('hidden');
                
                reanudarEscaneoSeguro();
            }
        }

        async function cargarDatosSheet() {
            const status = document.getElementById('statusCarga');
            status.textContent = "Conectando con Google Sheets...";
            status.className = "text-center text-sm font-semibold mb-4 text-blue-600";

            try {
                let response = await fetch(WEB_APP_URL);
                datosSheet = await response.json();
                
                status.textContent = `✅ Datos cargados (${datosSheet.length} registros cargados)`;
                status.className = "text-center text-sm font-semibold mb-4 text-green-600";

                indiceActual = 0;
                actualizarUbicacionPantalla();
                
                document.getElementById('seccionEscaneo').classList.remove('hidden');
                iniciarEscanner();
            } catch (error) {
                console.error(error);
                status.textContent = "❌ Error al cargar datos. Verifique la URL de Apps Script.";
                status.className = "text-center text-sm font-semibold mb-4 text-red-600";
            }
        }

        function iniciarEscanner() {
            if (escaneando) return;

            html5QrCode = new Html5Qrcode("reader", {
                experimentalFeatures: { useBarCodeDetectorIfSupported: true },
                verbose: false
            });
            const config = { 
                fps: 20,
                qrbox: { width: 260, height: 100 },
                aspectRatio: 1.777778,
                disableFlip: true
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText) => { procesarLectura(decodedText); },
                (errorMessage) => {}
            ).then(() => {
                escaneando = true;
                document.getElementById('btnDetener').classList.remove('hidden');
                document.getElementById('btnIniciar').classList.add('hidden');
            }).catch(err => {
                console.error("No se pudo iniciar la cámara", err);
                alert("No se pudo acceder a la cámara. Asegúrese de dar permisos de cámara.");
            });
        }

        function detenerEscanner() {
            if (html5QrCode && escaneando) {
                html5QrCode.stop().then(() => {
                    escaneando = false;
                    document.getElementById('btnDetener').classList.add('hidden');
                    document.getElementById('btnIniciar').classList.remove('hidden');
                }).catch(err => console.error("Error al detener cámara", err));
            }
        }

        function reiniciarEscanner() {
            if (!escaneando) iniciarEscanner();
        }

        function procesarLectura(codigoLeido) {
            try {
                if (html5QrCode) html5QrCode.pause();
            } catch(e) {}

            const rackSeleccionado = document.getElementById('selectRack').value;
            const nivelSeleccionado = document.getElementById('inputNivel').value;
            const divResultado = document.getElementById('resultadoValidacion');
            const lblUbicacion = document.getElementById('lblUbicacionExacta').textContent.trim();

            divResultado.classList.remove('hidden');

            const numRackSeleccionado = parseInt(rackSeleccionado, 10);

            let encontrado = datosSheet.find(row => {
                let esPicking = row.tipo.toUpperCase() === "PICKING";
                let esNivelA = row.nivel.toUpperCase() === nivelSeleccionado.toUpperCase();
                
                let numRackFila = parseInt(String(row.rack).replace(/\D/g, ''), 10);
                let perteneceRackExacto = !isNaN(numRackFila) && numRackFila === numRackSeleccionado;

                let coincideCodigo = row.codigoEsperado.trim() === codigoLeido.trim();

                return esPicking && esNivelA && perteneceRackExacto && coincideCodigo;
            });

            if (encontrado) {
                divResultado.className = "mt-4 p-4 rounded-lg text-center font-bold text-lg bg-green-100 text-green-800 border border-green-400";
                divResultado.innerHTML = `✅ ¡CORRECTO!<br><span class="text-sm font-normal">Fila ${encontrado.fila} | Ubicación: ${encontrado.ubicacion}</span>`;
                beep(600, 200);
            } else {
                let registroEsperado = obtenerRegistrosFiltrados()[indiceActual];
                let codigoDeberia = registroEsperado ? registroEsperado.codigoEsperado : "Desconocido";

                let errorObj = {
                    fecha: new Date().toLocaleString(),
                    rack: `Rack ${rackSeleccionado} / ${nivelSeleccionado}`,
                    ubicacion: lblUbicacion,
                    codigoLeido: codigoLeido,
                    codigoEsperado: codigoDeberia
                };

                let indiceExistente = listaErrores.findIndex(err => err.ubicacion === lblUbicacion);

                if (indiceExistente !== -1) {
                    listaErrores[indiceExistente] = errorObj;
                } else {
                    listaErrores.push(errorObj);

                    fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify(errorObj)
                    }).catch(err => console.error("Error guardando en la nube", err));
                }

                divResultado.className = "mt-4 p-4 rounded-lg text-center font-bold text-lg bg-red-100 text-red-800 border border-red-400";
                divResultado.innerHTML = `❌ NO COINCIDE O NO ES PICKING<br><span class="text-sm font-normal">Código leído: ${codigoLeido}<br>Rack: ${rackSeleccionado} | Nivel: ${nivelSeleccionado}</span>`;
                beep(200, 400);

                document.getElementById('btnExportarPDF').classList.remove('hidden');
            }
        }

        function descargarReportePDF() {
            if (listaErrores.length === 0) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(16);
            doc.setTextColor(220, 38, 38);
            doc.text("Reporte de Discrepancias de Picking", 14, 15);

            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text(`Fecha del reporte: ${new Date().toLocaleString()}`, 14, 22);
            doc.text(`Total Ubicaciones con Error: ${listaErrores.length}`, 14, 27);

            const bodyTabla = listaErrores.map(item => [
                item.fecha.split(', ')[1] || item.fecha,
                item.rack,
                item.ubicacion,
                item.codigoLeido,
                item.codigoEsperado
            ]);

            doc.autoTable({
                startY: 32,
                head: [['Hora', 'Rack/Nivel', 'Ubicación', 'Leído (Error)', 'Esperado']],
                body: bodyTabla,
                headStyles: { fillColor: [15, 23, 42] },
                styles: { fontSize: 9 }
            });

            doc.save(`Errores_Picking_${new Date().toISOString().slice(0,10)}.pdf`);
        }

        function beep(frequency, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.value = frequency;
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                setTimeout(() => { oscillator.stop(); }, duration);
            } catch(e) {}
        }
    </script>
</body>
</html>
